runtime:

  name: MiniTalk Runtime Model
  version: 1.0

##############################################################################
# GLOBAL PRINCIPLES
##############################################################################

principles:

  everythingIsAnObject: true

  classesAreObjects: true

  metaclassesAreObjects: true

  singleInheritance: true

  lexicalClosures: true

  nonLocalReturns: true

  dynamicClassEvolution: true

##############################################################################
# BOOTSTRAP OBJECT GRAPH
##############################################################################

bootstrap:

  Object:

    runtimeType: MTClass

    superclass: null

    class: ObjectClass

  Class:

    runtimeType: MTClass

    superclass: Object

    class: ClassClass

  ObjectClass:

    runtimeType: MTMetaclass

    superclass: ClassClass

    class: ClassClass

  ClassClass:

    runtimeType: MTMetaclass

    superclass: ObjectClass

    class: ClassClass

##############################################################################
# ROOT OBJECT
##############################################################################

MTObject:

  abstract: true

  fields:

    objectId:

      type: Long

      unique: true

    clazz:

      type: MTClass

      nullable: false

    propertyValues:

      type: MTDictionary<MTSymbol, MTObject>

      nullable: false

  responsibilities:

    - storeProperties
    - receiveMessages
    - provideIdentity

##############################################################################
# CLASSES
##############################################################################

MTClass:

  superclass: MTObject

  fields:

    name:

      type: MTSymbol

    superclass:

      type: MTClass

      nullable: true

    metaclass:

      type: MTMetaclass

      nullable: false

    declaredProperties:

      type: MTDictionary<MTSymbol, MTProperty>

    allProperties:

      type: MTDictionary<MTSymbol, MTProperty>

    methods:

      type: MTDictionary<MTSymbol, MTMethod>

  responsibilities:

    - createInstances
    - lookupMethods
    - manageProperties
    - manageInheritance

##############################################################################
# METACLASSES
##############################################################################

MTMetaclass:

  superclass: MTClass

  responsibilities:

    - ownClassMethods
    - ownClassProperties

##############################################################################
# METHODS
##############################################################################

MTMethod:

  superclass: MTObject

  fields:

    selector:

      type: MTSymbol

    ownerClass:

      type: MTClass

    parameterCount:

      type: Integer

    body:

      type: MTBlockNode

    sourceComment:

      type: MTCommentNode
      nullable: true

  responsibilities:

    - execute
    - receiveArguments

##############################################################################
# PROPERTIES
##############################################################################

MTProperty:

  superclass: MTObject

  fields:

    name:

      type: MTSymbol

    ownerClass:

      type: MTClass

    defaultValue:

      type: MTObject

      default: nil

##############################################################################
# SYMBOLS
##############################################################################

MTSymbol:

  superclass: MTString

  constraints:

    interned: true

    uniquePerName: true

##############################################################################
# SYMBOL TABLE
##############################################################################

MTSymbolTable:

  singleton: true

  fields:

    symbols:

      type: MTDictionary<String, MTSymbol>

  responsibilities:

    - intern
    - lookup

##############################################################################
# PROPERTY MANAGEMENT
##############################################################################

propertyManagement:

  inheritance: true

  autoGeneratedAccessors: true

  generatedGetter:

    selectorPattern: "<propertyName>"

  generatedSetter:

    selectorPattern: "<propertyName>:"

  propertyValueStorage:

    location: MTObject.propertyValues

##############################################################################
# PROPERTY RECOMPUTATION
##############################################################################

propertyRecomputation:

  trigger:

    - addProperty

  algorithm: |

    newAllProperties =
        copy(superclass.allProperties)

    + copy(declaredProperties)

  storeResult: true

##############################################################################
# DYNAMIC CLASS EVOLUTION
##############################################################################

dynamicClassEvolution:

  enabled: true

  affectsExistingInstances:

    immediateMigration: false

##############################################################################
# MISSING PROPERTIES
##############################################################################

missingProperties:

  readAccess:

    returns: nil

    warning:

      enabled: true

      optional: true

  writeAccess:

    behavior: createEntry

##############################################################################
# PROPERTY REBINDING
##############################################################################

rebind:

  instanceMethod:

    selector: rebindProps

    behavior: |

      For each property declared
      in clazz.allProperties

      if propertyValues
      does not contain property

      then add:

          property -> nil

##############################################################################
# METHOD LOOKUP
##############################################################################

methodLookup:

  start:

    receiverClass: true

  follow:

    superclassChain: true

  stopAt:

    - Object

##############################################################################
# PROPERTY LOOKUP
##############################################################################

propertyLookup:

  start:

    receiverClass: true

  follow:

    superclassChain: true

  stopAt:

    - Object

##############################################################################
# INSTANCE CREATION
##############################################################################

instanceCreation:

  selector:

    - new

  algorithm:

    - allocateObject
    - initializeProperties
    - sendInitializeIfPresent

##############################################################################
# INITIALIZE SEMANTICS
##############################################################################

initialize:

  automaticSend: true

  selector: initialize

  optional: true

##############################################################################
# SCOPES
##############################################################################

MTScope:

  fields:

    parent:

      type: MTScope

      nullable: true

    bindings:

      type: MTDictionary<MTSymbol, MTObject>

  operations:

    - define
    - lookup
    - assign

##############################################################################
# CLOSURES
##############################################################################

MTBlock:

  superclass: MTObject

  fields:

    ast:

      type: MTBlockNode

    lexicalScope:

      type: MTScope

  responsibilities:

    - execute
    - captureVariables

##############################################################################
# RETURNS
##############################################################################

MTNonLocalReturnException:

  purpose:

    implementNonLocalReturn

  fields:

    value:

      type: MTObject

##############################################################################
# KERNEL CLASSES
##############################################################################

kernelClasses:

  - Object
  - Class

  - Method
  - Property

  - Collection
  - SequenceableCollection

  - Array
  - Set
  - Dictionary

  - String
  - Symbol

  - Magnitude
  - Integer

  - Boolean

  - Block

##############################################################################
# SINGLETONS
##############################################################################

singletons:

  nil:

    class: Object

    unique: true

  true:

    class: Boolean

    unique: true

  false:

    class: Boolean

    unique: true

##############################################################################
# DICTIONARY PROTOCOL
##############################################################################

dictionaryProtocol:

  requiredMethods:

    - at:
    - at:put:
    - removeKey:
    - includesKey:
    - keys
    - values
    - size

##############################################################################
# VALIDATION SCENARIOS
##############################################################################

validation:

  scenarios:

    - |
      Person <- Class new: #Person.

      Person addProperty: #age.

      p <- Person new.

      p age: 38.

      p age.

    - |
      Person addProperty: #age.

      p <- Person new.

      Person addProperty: #name.

      p name.

      p rebindProps.

      p name.

    - |
      Employee <- Class
          subclass: Person
          new: #Employee.

      Employee addProperty: #salary.

      e <- Employee new.

      e age: 42.

      e salary: 50000.

    - |
      Person class
          addProperty: #species.

      Person species: 'Human'.

    - |
      Person addMethod:
          #fullName
          body:
          [
              ^name
          ].

      Employee addMethod:
          #fullName
          body:
          [
              ^super fullName
          ].
		  