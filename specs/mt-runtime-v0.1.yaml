runtime:
  name: MiniTalk Runtime Model
  version: 0.2

##############################################################################
# GLOBAL PRINCIPLES
##############################################################################

principles:
  everythingIsAnObject: true
  classesAreObjects: true
  metaclassesAreObjects: true
  singleInheritance: true
  lexicalClosures: true
  nonLocalReturns: true
  dynamicClassEvolution: true
  javaImplementationPrefix: MT

##############################################################################
# BOOTSTRAP OBJECT GRAPH
##############################################################################

bootstrap:

  Object:
    superclass: null
    class: ObjectClass

  Class:
    superclass: Object
    class: ClassClass

  ObjectClass:
    superclass: ClassClass
    class: ClassClass

  ClassClass:
    superclass: ObjectClass
    class: ClassClass

##############################################################################
# ROOT OBJECT
##############################################################################

MTObject:

  abstract: true

  fields:
    - objectId
    - clazz
    - propertyValues

  responsibilities:
    - dynamic message dispatch
    - property storage
    - runtime typing
    - object identity

  messageDispatch:
    unary:
      send(selector)

    keywordOrBinary:
      send(selector, arguments)

##############################################################################
# CLASSES
##############################################################################

MTClass:

  superclass: MTObject

  fields:
    - name
    - superclass
    - declaredProperties
    - allProperties
    - methods

  responsibilities:
    - instance creation
    - method lookup
    - property management
    - inheritance management

  note: >
    MTClass no longer contains a dedicated metaclass field.
    Class relationships are represented exclusively through
    MTObject.clazz.

##############################################################################
# METACLASSES
##############################################################################

MTMetaclass:

  superclass: MTClass

  responsibilities:
    - represent meta-level classes
    - participate in bootstrap graph

  note: >
    Current implementation only specializes MTClass and does not
    introduce additional behaviour.

##############################################################################
# METHODS
##############################################################################

MTMethod:

  superclass: MTObject

  fields:
    - selector
    - ownerClass
    - body

  responsibilities:
    - executable behavior
    - message implementation
    - method invocation

##############################################################################
# PROPERTIES
##############################################################################

MTProperty:

  superclass: MTObject

  fields:
    - name
    - ownerClass
    - defaultValue

##############################################################################
# SYMBOLS
##############################################################################

MTSymbol:

  superclass: MTString

  constraints:
    - globally interned
    - identity comparison allowed

##############################################################################
# PROPERTY MANAGEMENT
##############################################################################

propertyManagement:

  inheritance: true

  storage:
    owner: MTObject
    field: propertyValues

  lookup:
    source: allProperties

##############################################################################
# PROPERTY RECOMPUTATION
##############################################################################

propertyRecomputation:

  trigger:
    - property addition

  algorithm:
    - inherit superclass properties
    - add local properties

  storeResult: true

##############################################################################
# DYNAMIC CLASS EVOLUTION
##############################################################################

dynamicClassEvolution:

  enabled: true

  strategy: lazyMigration

  note: >
    Existing instances may require rebindProps()
    to synchronize with newly added properties.

##############################################################################
# PROPERTY REBINDING
##############################################################################

rebind:

  instanceMethod: rebindProps

  purpose: >
    Synchronize an instance layout with the current
    property definition of its class.

##############################################################################
# METHOD LOOKUP
##############################################################################

methodLookup:

  start:
    receiver.clazz

  follow:
    superclass

  stopAt:
    null

##############################################################################
# INSTANCE CREATION
##############################################################################

instanceCreation:

  entryPoint:
    MTClass.newInstance()

  algorithm:
    - create MTObject
    - set clazz
    - rebind properties
    - return object

##############################################################################
# SCOPES
##############################################################################

MTScope:

  responsibilities:
    - lexical variable storage
    - parent scope resolution
    - closure support

  assign:
    description: >
      assign(name,value) never creates a new variable.

  activationScope:
    description: >
      Block activation creates parameters and temporaries
      while preserving access to captured variables.

##############################################################################
# CLOSURES
##############################################################################

MTBlock:

  superclass: MTObject

  responsibilities:
    - lexical capture
    - delayed execution
    - closure activation

  supportedMessages:
    - value
    - value:
    - value:value:
    - valueArray:

##############################################################################
# RETURNS
##############################################################################

MTNonLocalReturnException:

  purpose:
    implementation of non-local return (^)

##############################################################################
# KERNEL CLASSES
##############################################################################

kernelClasses:

  - Object
  - Class

  - Integer
  - Boolean

  - String
  - Symbol

  - Array
  - Dictionary

  - Block

##############################################################################
# SINGLETONS
##############################################################################

singletons:

  nil:
    class: Nil

  true:
    class: Boolean

  false:
    class: Boolean

##############################################################################
# OBJECT PRIMITIVES
##############################################################################

objectPrimitives:

  - print
  - println

##############################################################################
# DICTIONARY PROTOCOL
##############################################################################

dictionaryProtocol:

  requiredMethods:
    - at:
    - at:put:
    - includesKey:
    - size

##############################################################################
# VALIDATION SCENARIOS
##############################################################################

validation:

  scenarios:

    - dynamic message dispatch

    - lexical closures

    - nested closures

    - non-local returns

    - property inheritance

    - runtime class registration

    - class lookup through classNamed()

    - object inheritance through Object

    - 42 println